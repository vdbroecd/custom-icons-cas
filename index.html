<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAS genesisWorld · Icon Library</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css">
<style>
  :root {
    --ha-blue: #03a9f4;
    --ha-blue-dark: #0288d1;
    --ha-surface: #fafafa;
    --ha-card: #ffffff;
    --ha-border: #e0e0e0;
    --ha-text-primary: #212121;
    --ha-text-secondary: #727272;
    --ha-shadow-sm: 0 1px 3px rgba(0,0,0,.12), 0 1px 2px rgba(0,0,0,.08);
    --ha-shadow-md: 0 3px 6px rgba(0,0,0,.10), 0 2px 4px rgba(0,0,0,.06);
    --ha-radius: 12px;
    --ha-radius-sm: 8px;
    --ha-radius-xs: 4px;
    --accent: #03a9f4;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ha-surface: #111111;
      --ha-card: #1c1c1c;
      --ha-border: #2c2c2c;
      --ha-text-primary: #e1e1e1;
      --ha-text-secondary: #9e9e9e;
      --ha-shadow-sm: 0 1px 3px rgba(0,0,0,.4);
      --ha-shadow-md: 0 3px 6px rgba(0,0,0,.35);
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--ha-surface);
    color: var(--ha-text-primary);
    margin: 0;
    padding: 0 0 80px;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ───────────────────────────────────────────── */
  .header {
    background: var(--ha-card);
    border-bottom: 1px solid var(--ha-border);
    padding: 0 20px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--ha-shadow-sm);
  }
  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    height: 60px;
  }
  .header-logo {
    height: 32px;
    width: auto;
    flex-shrink: 0;
  }
  .header-title {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ha-text-primary);
    white-space: nowrap;
  }
  .header-title span {
    color: var(--ha-blue);
  }
  .header-spacer { flex: 1; }
  .header-meta {
    font-size: 12px;
    color: var(--ha-text-secondary);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .pill-count {
    background: var(--ha-blue);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    line-height: 1.6;
  }

  /* ── TOOLBAR ──────────────────────────────────────────── */
  .toolbar {
    background: var(--ha-card);
    border-bottom: 1px solid var(--ha-border);
    padding: 0 20px;
  }
  .toolbar-inner {
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    flex-wrap: wrap;
  }
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 380px;
  }
  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ha-text-secondary);
    pointer-events: none;
  }
  .search-wrap input {
    width: 100%;
    height: 36px;
    background: var(--ha-surface);
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    padding: 0 12px 0 36px;
    font-size: 14px;
    color: var(--ha-text-primary);
    outline: none;
    transition: border-color .15s;
    -webkit-appearance: none;
  }
  .search-wrap input::placeholder { color: var(--ha-text-secondary); }
  .search-wrap input:focus { border-color: var(--ha-blue); }
  .search-wrap input::-webkit-search-cancel-button { display: none; }

  .clear-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ha-text-secondary);
    padding: 2px;
    line-height: 1;
    display: none;
  }
  .clear-btn.visible { display: block; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
    height: 36px;
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    background: var(--ha-card);
    color: var(--ha-text-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .12s, border-color .12s;
    white-space: nowrap;
    text-decoration: none;
  }
  .btn:hover { background: var(--ha-surface); border-color: var(--ha-blue); }
  .btn svg { flex-shrink: 0; }
  .btn-primary {
    background: var(--ha-blue);
    border-color: var(--ha-blue-dark);
    color: #fff;
  }
  .btn-primary:hover { background: var(--ha-blue-dark); border-color: var(--ha-blue-dark); }

  .tab-switcher {
    display: inline-flex;
    background: var(--ha-surface);
    border: 1px solid var(--ha-border);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    margin-left: auto;
    margin-right: 12px;
  }
  .tab-button {
    border: none;
    background: transparent;
    color: var(--ha-text-secondary);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all .12s ease;
  }
  .tab-button.active {
    background: var(--ha-blue);
    color: #fff;
    box-shadow: var(--ha-shadow-sm);
  }

  .tab-panel[hidden] { display: none !important; }

  .script-shell {
    max-width: 1280px;
    margin: 24px auto 0;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 320px minmax(0, 1fr);
    gap: 20px;
  }
  .script-sidebar,
  .script-form-panel {
    background: var(--ha-card);
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius);
    box-shadow: var(--ha-shadow-sm);
  }
  .script-sidebar {
    padding: 16px;
  }
  .script-sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 8px;
  }
  .script-sidebar-header h2 {
    font-size: 16px;
    margin: 0;
  }
  .script-list {
    display: grid;
    gap: 10px;
    max-height: 540px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .script-list::-webkit-scrollbar { width: 4px; }
  .script-list::-webkit-scrollbar-thumb { background: var(--ha-border); border-radius: 4px; }
  .script-card {
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    background: var(--ha-surface);
    padding: 12px;
    cursor: pointer;
    transition: border-color .12s, box-shadow .12s;
    text-align: left;
    width: 100%;
    color: inherit;
  }
  .script-card:hover,
  .script-card.active {
    border-color: var(--ha-blue);
    box-shadow: var(--ha-shadow-sm);
  }
  .script-card-title {
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--ha-text-primary);
  }
  .script-card-meta {
    font-size: 11px;
    color: var(--ha-text-secondary);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .script-form-panel {
    padding: 18px;
  }
  .script-form {
    display: grid;
    gap: 16px;
  }
  .form-section {
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius);
    background: var(--ha-surface);
    padding: 14px;
    display: grid;
    gap: 14px;
  }
  .form-section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .form-section-header h3 {
    margin: 0;
    font-size: 14px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--ha-text-secondary);
  }
  .script-form-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(180px, 1fr));
    gap: 14px;
  }
  .field {
    display: grid;
    gap: 6px;
  }
  .field label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: var(--ha-text-secondary);
  }
  .field input,
  .field select,
  .field textarea {
    width: 100%;
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    background: var(--ha-surface);
    color: var(--ha-text-primary);
    font: inherit;
    padding: 10px 12px;
    resize: vertical;
  }
  .field textarea {
    min-height: 120px;
  }
  .quill-editor-wrap {
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    background: var(--ha-card);
    overflow: hidden;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow {
    border: 0;
    border-bottom: 1px solid var(--ha-border);
    background: var(--ha-surface);
    padding: 8px 10px;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats {
    margin-right: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats button,
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats select {
    border: 1px solid var(--ha-border);
    border-radius: 6px;
    background: var(--ha-card);
    color: var(--ha-text-primary);
    height: 28px;
    min-width: 28px;
    padding: 0 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: border-color .12s ease, background .12s ease;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats button:hover,
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats select:hover,
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats button:focus,
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats select:focus {
    border-color: var(--ha-blue);
    background: var(--ha-surface);
    outline: none;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats select {
    min-width: 110px;
    padding-right: 24px;
    appearance: none;
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    background: var(--ha-surface);
    color: var(--ha-text-primary);
    background-image: linear-gradient(45deg, transparent 50%, var(--ha-text-secondary) 50%), linear-gradient(135deg, var(--ha-text-secondary) 50%, transparent 50%);
    background-position: calc(100% - 12px) calc(50% - 2px), calc(100% - 8px) calc(50% - 2px);
    background-size: 4px 4px, 4px 4px;
    background-repeat: no-repeat;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats .custom-image-trigger,
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats .image-size-btn {
    min-width: 34px;
    padding: 0 10px;
    height: 28px;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats .image-size-group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border: 1px solid var(--ha-border);
    border-radius: 6px;
    background: var(--ha-surface);
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats .image-size-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ha-text-secondary);
    user-select: none;
  }
  .quill-editor-wrap .ql-toolbar.ql-snow .ql-formats .image-size-btn {
    min-width: 42px;
    font-size: 11px;
    font-weight: 700;
    padding: 0 6px;
    border-radius: 4px;
    background: var(--ha-card);
  }
  .quill-editor-wrap .ql-container.ql-snow {
    border: 0;
    min-height: 120px;
    font-family: inherit;
    font-size: 14px;
    color: var(--ha-text-primary);
    background: var(--ha-card);
  }
  .ql-editor img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    display: block;
    margin: 8px 0;
    cursor: pointer;
  }
  .quill-editor-wrap .ql-editor {
    min-height: 120px;
    padding: 12px 14px;
    line-height: 1.5;
  }
  .quill-editor-wrap .ql-editor.ql-blank::before {
    color: var(--ha-text-secondary);
    font-style: normal;
  }
  .quill-editor-wrap .quill-editor-code .ql-editor {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .code-side-by-side {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }
  .code-side-by-side .code-area {
    min-height: 20em;
    max-height: 20em;
    overflow-y: auto;
    cursor: pointer;
    transition: min-height .15s ease, max-height .15s ease, box-shadow .15s ease;
  }
  .code-side-by-side .code-area.expanded {
    min-height: 32em;
    max-height: 32em;
    box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.2);
  }
  .script-code-block {
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius);
    background: var(--ha-surface);
    padding: 14px;
    display: grid;
    gap: 14px;
    transition: all .18s ease;
  }
  .script-code-block-toggle {
    width: 32px;
    height: 32px;
    border: 1px solid var(--ha-border);
    border-radius: 50%;
    background: var(--ha-card);
    color: var(--ha-text-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all .12s ease;
    margin-left: auto;
    flex-shrink: 0;
  }
  .script-code-block-toggle svg {
    width: 16px;
    height: 16px;
    display: block;
  }
  .script-code-block-toggle .toggle-icon--shrink {
    display: none;
  }
  .script-code-block-toggle.expanded .toggle-icon--expand {
    display: none;
  }
  .script-code-block-toggle.expanded .toggle-icon--shrink {
    display: block;
  }
  .script-code-block-toggle:hover {
    border-color: var(--ha-blue);
    background: var(--ha-card);
  }
  .script-code-block.expanded {
    position: fixed;
    inset: 88px 18px 24px 18px;
    z-index: 120;
    background: var(--ha-card);
    box-shadow: 0 18px 42px rgba(0,0,0,.22);
    overflow: auto;
  }
  .script-code-block.expanded .script-code-block-header {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(18,18,18,.92);
    padding: 8px 0;
    backdrop-filter: blur(6px);
  }
  .notes-editor-panel {
    transition: all .18s ease;
  }
  .notes-editor-panel.expanded {
    position: fixed;
    inset: 88px 18px 24px 18px;
    z-index: 120;
    background: var(--ha-card);
    box-shadow: 0 18px 42px rgba(0,0,0,.22);
    padding: 14px;
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius);
  }
  .field .notes-editor {
    min-height: 200px;
    max-height: 260px;
    overflow-y: auto;
    padding: 12px;
    background: var(--ha-surface);
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    line-height: 1.5;
    transition: all .18s ease;
  }
  .notes-editor-panel.expanded .notes-editor {
    min-height: calc(100vh - 150px);
    max-height: none;
    overflow: auto;
    background: var(--ha-card);
    padding: 16px;
  }
  .field .notes-editor:empty:before {
    content: "Typ hier je aantekeningen…";
    color: var(--ha-text-secondary);
  }
  .notes-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .inline-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .notes-header-actions {
    margin-left: auto;
    justify-content: flex-end;
    align-items: center;
  }
  .tag-button {
    border: 1px solid var(--ha-border);
    background: var(--ha-surface);
    border-radius: var(--ha-radius-sm);
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .code-area {
    min-height: 240px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 12px;
    line-height: 1.6;
  }
  .code-area.original-code {
    color: var(--ha-text-primary);
    background: var(--ha-surface);
  }
  .code-area.original-code.has-format-preview {
    color: #7a1f1f;
    background: rgba(122, 31, 31, 0.08);
  }
  .code-area.formatted-code {
    color: var(--ha-text-primary);
    background: var(--ha-surface);
  }
  .code-area.formatted-code.has-content {
    color: #1d6b3d;
    background: rgba(29, 107, 61, 0.08);
  }
  @media (max-width: 900px) {
    .script-shell {
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 600px) {
    .script-form-grid {
      grid-template-columns: 1fr;
    }
    .tab-switcher {
      margin-left: 0;
      margin-right: 0;
    }
  }

  #noResults {
    display: none;
    max-width: 1280px;
    margin: 60px auto;
    text-align: center;
    color: var(--ha-text-secondary);
    font-size: 15px;
    padding: 0 20px;
  }
  #noResults svg { display: block; margin: 0 auto 16px; opacity: .3; }

  /* ── MAIN CONTENT ─────────────────────────────────────── */
  .main {
    max-width: 1280px;
    margin: 24px auto 0;
    padding: 0 20px;
  }

  .group-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ha-text-secondary);
    padding: 0 0 10px;
    border-bottom: 1px solid var(--ha-border);
    margin: 0 0 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .group-label span:first-child {
    flex: 1 1 auto;
  }
  .group-label-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-label-count {
    font-weight: 500;
    font-size: 11px;
    background: var(--ha-surface);
    border: 1px solid var(--ha-border);
    border-radius: 20px;
    padding: 1px 8px;
    color: var(--ha-text-secondary);
    letter-spacing: 0;
    text-transform: none;
  }
  .group-download-btn {
    appearance: none;
    border: 1px solid var(--ha-border);
    background: var(--ha-surface);
    color: var(--ha-text-primary);
    border-radius: var(--ha-radius-sm);
    height: 28px;
    padding: 0 10px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .02em;
    text-transform: none;
    cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .group-download-btn:hover {
    background: var(--ha-card);
    border-color: var(--ha-blue);
  }

  .group-section { margin: 0 0 32px; }

  .icon-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
  }

  .icon-item {
    background: var(--ha-card);
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    padding: 12px 8px 10px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: border-color .12s, box-shadow .12s, transform .1s;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    overflow: hidden;
  }
  .icon-item:hover {
    border-color: var(--ha-blue);
    box-shadow: var(--ha-shadow-md);
    transform: translateY(-1px);
    z-index: 1;
  }
  .icon-item:focus-visible {
    outline: 2px solid var(--ha-blue);
    outline-offset: 2px;
  }
  .icon-item:active { transform: translateY(0); }

  .icon-thumb-wrap {
    width: 60px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--ha-radius-xs);
    overflow: hidden;
    flex-shrink: 0;
    padding: 5px;
  }
  .icon-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .icon-name {
    font-size: 10px;
    color: var(--ha-text-secondary);
    text-align: center;
    line-height: 1.3;
    word-break: break-word;
    overflow-wrap: anywhere;
    max-width: 88px;
  }

  /* ── MODAL OVERLAY ────────────────────────────────────── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 900;
    justify-content: center;
    align-items: center;
    padding: 16px;
    backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--ha-card);
    border-radius: var(--ha-radius);
    padding: 28px 28px 24px;
    width: 100%;
    max-width: 420px;
    position: relative;
    box-shadow: 0 20px 60px rgba(0,0,0,.25);
    animation: modal-in .15s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--ha-text-secondary);
    padding: 4px;
    line-height: 1;
    border-radius: var(--ha-radius-xs);
    transition: background .1s;
  }
  .modal-close:hover { background: var(--ha-surface); }

  .modal-icon-wrap {
    width: 100px;
    height: 100px;
    margin: 0 auto 20px;
    border-radius: var(--ha-radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .modal-icon-wrap img { width: 100%; height: 100%; object-fit: contain; }

  .modal-filename {
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    word-break: break-all;
    margin: 0 0 6px;
  }
  .modal-hex {
    font-size: 12px;
    text-align: center;
    color: var(--ha-text-secondary);
    font-family: "SF Mono", "Fira Code", monospace;
    margin: 0 0 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .hex-swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    border: 1px solid rgba(0,0,0,.15);
    vertical-align: middle;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions .btn { flex: 1; justify-content: center; }

  /* ── GIT LOG MODAL ────────────────────────────────────── */
  .git-modal {
    max-width: 560px;
  }
  .git-modal h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 16px;
    color: var(--ha-text-primary);
  }
  .commit-list {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 380px;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .commit-list::-webkit-scrollbar { width: 4px; }
  .commit-list::-webkit-scrollbar-thumb { background: var(--ha-border); border-radius: 4px; }

  .commit-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--ha-border);
    font-size: 13px;
  }
  .commit-item:last-child { border-bottom: none; }
  .commit-msg {
    font-weight: 500;
    color: var(--ha-text-primary);
    margin: 0 0 4px;
    line-height: 1.4;
  }
  .commit-meta {
    color: var(--ha-text-secondary);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .commit-author { font-weight: 500; }
  .commit-dot {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--ha-border);
    display: inline-block;
  }
  .commit-link {
    color: var(--ha-blue);
    text-decoration: none;
    font-size: 12px;
  }
  .commit-link:hover { text-decoration: underline; }

  /* ── LOADING / EMPTY STATES ───────────────────────────── */
  .loading-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
    margin-bottom: 32px;
  }
  .skeleton {
    background: var(--ha-card);
    border: 1px solid var(--ha-border);
    border-radius: var(--ha-radius-sm);
    height: 110px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }

  /* ── TOAST ────────────────────────────────────────────── */
  .toast {
    position: fixed;
    bottom: 88px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #212121;
    color: #fff;
    font-size: 13px;
    padding: 9px 18px;
    border-radius: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 1000;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── FOOTER ───────────────────────────────────────────── */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: var(--ha-card);
    border-top: 1px solid var(--ha-border);
    padding: 12px 20px;
    text-align: center;
    font-size: 12px;
    color: var(--ha-text-secondary);
    z-index: 50;
  }

  /* ── MOBILE ───────────────────────────────────────────── */
  @media (max-width: 600px) {
    .header-title { font-size: 14px; }
    .toolbar-inner { height: auto; padding: 10px 0; gap: 8px; }
    .search-wrap { max-width: 100%; }
    .icon-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
    .modal { padding: 20px 16px 18px; }
    .modal-icon-wrap { width: 80px; height: 80px; }
    .modal-actions { flex-direction: column; }
    .btn { font-size: 13px; }
    .git-modal { max-width: 100%; }
  }
  @media (max-width: 400px) {
    .header-meta { display: none; }
    .icon-grid { grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 8px; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>
<script>
const iconBasePath = "icons";
let allIcons = {};
window.__quillEditors = {};

function formatTimestampValue() {
  const now = new Date();
  const day = String(now.getDate()).padStart(2, "0");
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const year = now.getFullYear();
  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");
  return `[${day}-${month}-${year} ${hours}:${minutes}]`;
}

function createQuillToolbarMarkup(options = {}) {
  const plainText = Boolean(options.plainText);

  return `
    <div class="ql-formats">
      ${!plainText ? `
        <select class="ql-font" aria-label="Lettertype">
          <option value="sans-serif" selected>Sans Serif</option>
          <option value="serif">Serif</option>
          <option value="monospace">Monospace</option>
        </select>
        <select class="ql-size" aria-label="Tekstgrootte">
          <option value="6px">6px</option>
          <option value="8px">8px</option>
          <option value="10px">10px</option>
          <option value="12px">12px</option>
          <option value="14px">14px</option>
          <option value="16px" selected>16px</option>
          <option value="18px">18px</option>
          <option value="20px">20px</option>
          <option value="22px">22px</option>
          <option value="24px">24px</option>
          <option value="25px">25px</option>
        </select>
      ` : ""}
      <button class="ql-bold" type="button" aria-label="Vet"></button>
      <button class="ql-italic" type="button" aria-label="Cursief"></button>
      <button class="ql-underline" type="button" aria-label="Onderstreept"></button>
      <button class="ql-header" value="1" type="button" aria-label="Kop 1"></button>
      <button class="ql-header" value="2" type="button" aria-label="Kop 2"></button>
      <button class="ql-list" value="ordered" type="button" aria-label="Geordende lijst"></button>
      <button class="ql-list" value="bullet" type="button" aria-label="Ongeordende lijst"></button>
      <button class="ql-link" type="button" aria-label="Link"></button>
      <button class="ql-undo" type="button" aria-label="Ongedaan maken"></button>
      <button class="ql-redo" type="button" aria-label="Opnieuw"></button>
      ${!plainText ? `
        <span class="image-size-group" aria-label="Afbeeldingsgrootte">
          <span class="image-size-label">Pct</span>
          <button class="image-size-btn" type="button" data-size="25">25%</button>
          <button class="image-size-btn" type="button" data-size="50">50%</button>
          <button class="image-size-btn" type="button" data-size="75">75%</button>
          <button class="image-size-btn" type="button" data-size="100">100%</button>
          <button class="image-size-btn" type="button" data-size="150">150%</button>
        </span>
        <button class="custom-image-trigger" type="button" aria-label="Afbeelding invoegen">🖼</button>
      ` : ""}
      <button class="ql-timestamp" type="button" aria-label="Timestamp invoegen">⏱</button>
    </div>
  `;
}

function bindRichTextField(target, options = {}) {
  if (!target || !window.Quill || target.dataset.quillInitialized === "true") return null;

  const plainText = options.plainText || target.dataset.plainText === "true";
  const wrap = document.createElement("div");
  wrap.className = "quill-editor-wrap";

  const toolbar = document.createElement("div");
  toolbar.className = "ql-toolbar ql-snow";
  toolbar.innerHTML = createQuillToolbarMarkup({ plainText });

  const editor = document.createElement("div");
  editor.className = plainText ? "quill-editor quill-editor-code" : "quill-editor";
  editor.setAttribute("aria-label", target.getAttribute("aria-label") || target.id || "Rich text editor");

  const parent = target.parentNode;
  if (parent) {
    parent.insertBefore(wrap, target.nextSibling);
  }
  wrap.appendChild(toolbar);
  wrap.appendChild(editor);

  const imageInput = document.createElement("input");
  imageInput.type = "file";
  imageInput.accept = "image/*";
  imageInput.hidden = true;
  imageInput.setAttribute("aria-hidden", "true");
  document.body.appendChild(imageInput);

  const quill = new Quill(editor, {
    theme: "snow",
    modules: {
      toolbar: {
        container: toolbar,
        handlers: {
          undo: function () {
            this.quill.history.undo();
          },
          redo: function () {
            this.quill.history.redo();
          },
          timestamp: function () {
            const range = this.quill.getSelection(true) || { index: this.quill.getLength(), length: 0 };
            const value = formatTimestampValue();
            this.quill.insertText(range.index, value);
            this.quill.setSelection(range.index + value.length, 0);
          }
        }
      },
      history: {
        delay: 300,
        maxStack: 100,
        userOnly: true
      }
    },
    formats: ["bold", "italic", "underline", "header", "list", "link", "font", "size", "image"]
  });

  quill.__imageInput = imageInput;
  quill.__selectedImage = null;
  quill.__lastInsertedImage = null;

  function applyImageSize(sizeValue) {
    if (!sizeValue) return null;
    const image = quill.__selectedImage || quill.__lastInsertedImage || quill.root.querySelector("img:last-of-type");
    if (!image) return null;
    image.style.width = `${sizeValue}%`;
    image.style.height = "auto";
    image.style.maxWidth = "100%";
    image.style.display = "block";
    image.setAttribute("data-image-size", sizeValue);
    return image;
  }

  const customImageButton = toolbar.querySelector(".custom-image-trigger");
  if (customImageButton) {
    customImageButton.addEventListener("click", () => imageInput.click());
  }

  const imageSizeButtons = toolbar.querySelectorAll(".image-size-btn");
  imageSizeButtons.forEach(button => {
    button.addEventListener("click", () => {
      const sizeValue = button.dataset.size;
      if (!sizeValue) return;
      const image = applyImageSize(sizeValue);
      if (image) {
        quill.__selectedImage = image;
        quill.__lastInsertedImage = image;
      }
    });
  });

  editor.addEventListener("click", event => {
    const target = event.target.closest("img");
    if (!target) return;
    quill.__selectedImage = target;
    quill.__lastInsertedImage = target;
  });

  quill.root.addEventListener("click", event => {
    const target = event.target.closest("img");
    if (!target) return;
    quill.__selectedImage = target;
    quill.__lastInsertedImage = target;
  });

  imageInput.addEventListener("change", () => {
    const file = imageInput.files && imageInput.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      const range = quill.getSelection(true) || { index: quill.getLength(), length: 0 };
      quill.insertEmbed(range.index, "image", dataUrl, "user");
      quill.setSelection(range.index + 1, 0);

      const insertedImage = quill.root.querySelector("img:last-of-type");
      if (insertedImage) {
        quill.__lastInsertedImage = insertedImage;
        quill.__selectedImage = insertedImage;
        const currentSize = "100";
        applyImageSize(currentSize);
      }
    };
    reader.readAsDataURL(file);
    imageInput.value = "";
  });

  const initialValue = target.tagName === "TEXTAREA" ? (target.value || "") : (target.innerHTML || "");
  if (initialValue) {
    if (plainText) {
      quill.setText(String(initialValue).replace(/\r\n/g, "\n").replace(/\r/g, "\n"));
    } else {
      quill.clipboard.dangerouslyPasteHTML(initialValue);
    }
  }

  quill.on("text-change", () => {
    if (target.tagName === "TEXTAREA") {
      target.value = plainText ? quill.getText().replace(/\n$/, "") : quill.root.innerHTML;
    } else {
      target.innerHTML = quill.root.innerHTML;
    }
  });

  target.dataset.quillInitialized = "true";
  target.style.display = "none";
  window.__quillEditors[target.id] = quill;
  return quill;
}

function syncRichEditorContent(id, value) {
  const target = document.getElementById(id);
  if (!target || !target.dataset.quillInitialized) return;
  const quill = window.__quillEditors[id];
  if (!quill) return;
  const plainText = target.dataset.plainText === "true";
  const nextValue = value || "";
  if (plainText) {
    quill.setText(String(nextValue).replace(/\r\n/g, "\n").replace(/\r/g, "\n"));
    target.value = quill.getText().replace(/\n$/, "");
  } else {
    quill.clipboard.dangerouslyPasteHTML(nextValue);
    target.innerHTML = quill.root.innerHTML;
  }
}

function initRichTextEditors() {
  document.querySelectorAll("[data-rich-editor]").forEach(element => {
    bindRichTextField(element, { plainText: element.dataset.plainText === "true" });
  });
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

function getBgColor(iconName) {
  const hexMatch = iconName.match(/64 ([A-Fa-f0-9]{6})/);
  if (hexMatch) return "#" + hexMatch[1];
  if (iconName.includes(" 64") || iconName.toLowerCase().includes("dashboard")) return "#555555";
  return "white";
}

function renderGroups(groupedIcons) {
  const container = document.getElementById("groupContainer");
  container.innerHTML = "";
  const groups = Object.keys(groupedIcons).sort();

  groups.forEach(group => {
    const icons = groupedIcons[group];
    const section = document.createElement("section");
    section.classList.add("group-section");
    section.dataset.group = group;

    const label = document.createElement("div");
    label.className = "group-label";

    const labelTitle = document.createElement("span");
    labelTitle.textContent = group;

    const actions = document.createElement("div");
    actions.className = "group-label-actions";

    const count = document.createElement("span");
    count.className = "group-label-count";
    count.textContent = String(icons.length);

    const downloadBtn = document.createElement("button");
    downloadBtn.type = "button";
    downloadBtn.className = "group-download-btn";
    downloadBtn.textContent = "Download ZIP";
    downloadBtn.setAttribute("aria-label", `Download alle iconen uit groep ${group} als ZIP`);
    downloadBtn.onclick = () => downloadGroupAsZip(group, icons);

    actions.appendChild(count);
    actions.appendChild(downloadBtn);
    label.appendChild(labelTitle);
    label.appendChild(actions);
    section.appendChild(label);

    const grid = document.createElement("div");
    grid.className = "icon-grid";
    grid.setAttribute("role", "list");

    icons.sort((a, b) => {
      if (a.includes("64") && !b.includes(" 64")) return -1;
      if (!a.includes(" 64") && b.includes("64")) return 1;
      return a.localeCompare(b);
    }).forEach(iconName => {
      const iconPath = `https://vdbroecd.github.io/custom-icons-cas/${iconBasePath}/${encodeURIComponent(iconName)}`;
      const bgColor = getBgColor(iconName);
      const displayName = iconName.replace(/\.[^.]+$/, "").replace("icon_", "");

      const item = document.createElement("button");
      item.className = "icon-item";
      item.setAttribute("role", "listitem");
      item.setAttribute("aria-label", `${displayName} — klik om te openen`);
      item.dataset.iconname = iconName.toLowerCase();
      item.onclick = () => openPopup(iconPath, iconName, bgColor);

      item.innerHTML = `
        <div class="icon-thumb-wrap" style="background:${escHtml(bgColor)};">
          <img src="${escHtml(iconPath)}" alt="" loading="lazy">
        </div>
        <span class="icon-name">${escHtml(displayName)}</span>
      `;
      grid.appendChild(item);
    });

    section.appendChild(grid);
    container.appendChild(section);
  });
}

async function downloadGroupAsZip(groupName, iconNames) {
  if (!window.JSZip) {
    showToast("ZIP-download is niet beschikbaar");
    return;
  }

  const zip = new JSZip();
  showToast("ZIP wordt samengesteld…");

  for (const iconName of iconNames) {
    try {
      const fileUrl = `https://vdbroecd.github.io/custom-icons-cas/${iconBasePath}/${encodeURIComponent(iconName)}`;
      const response = await fetch(fileUrl);
      if (!response.ok) throw new Error(`Status ${response.status}`);
      const blob = await response.blob();
      zip.file(iconName, blob);
    } catch (error) {
      console.error(`Kon ${iconName} niet downloaden:`, error);
    }
  }

  const zipBlob = await zip.generateAsync({ type: "blob" });
  const downloadUrl = URL.createObjectURL(zipBlob);
  const link = document.createElement("a");
  link.href = downloadUrl;
  link.download = `${groupName}.zip`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(downloadUrl);
  showToast(`${iconNames.length} iconen gedownload`);
}

async function loadIcons() {
  try {
    const response = await fetch(`https://api.github.com/repos/vdbroecd/custom-icons-cas/contents/${iconBasePath}`);
    if (!response.ok) throw new Error("GitHub API fout: " + response.status);
    const files = await response.json();

    let totalFiles = 0;
    files.forEach(file => {
      if (!file.name.endsWith(".svg") && !file.name.endsWith(".png")) return;
      totalFiles++;
      const parts = file.name.replace("icon_", "").split(" ");
      const groupName = parts[0];
      if (!allIcons[groupName]) allIcons[groupName] = [];
      allIcons[groupName].push(file.name);
    });

    document.getElementById("iconCount").textContent = totalFiles;
    document.getElementById("loadingState").style.display = "none";
    renderGroups(allIcons);
  } catch (err) {
    document.getElementById("loadingState").innerHTML =
      `<p style="text-align:center;color:var(--ha-text-secondary);padding:40px 20px;">Fout bij laden: ${escHtml(err.message)}</p>`;
    console.error(err);
  }
}

function searchIcons() {
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const clearBtn = document.getElementById("clearBtn");
  clearBtn.classList.toggle("visible", q.length > 0);

  let totalVisible = 0;
  document.querySelectorAll(".group-section").forEach(section => {
    let sectionVisible = 0;
    section.querySelectorAll(".icon-item").forEach(item => {
      const match = !q || item.dataset.iconname.includes(q);
      item.style.display = match ? "" : "none";
      if (match) sectionVisible++;
    });
    section.style.display = sectionVisible > 0 ? "" : "none";
    totalVisible += sectionVisible;
    const countEl = section.querySelector(".group-label-count");
    if (countEl) countEl.textContent = sectionVisible;
  });

  const noResults = document.getElementById("noResults");
  noResults.style.display = totalVisible === 0 && q ? "block" : "none";
  document.getElementById("searchTerm").textContent = q;
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  searchIcons();
  document.getElementById("searchInput").focus();
}

function openPopup(imagePath, iconName, hexColor) {
  const popup = document.getElementById("popup");
  document.getElementById("popupImage").src = imagePath;
  document.getElementById("popupImage").alt = iconName;
  document.getElementById("popupTitle").textContent = iconName;
  document.getElementById("popupIconWrap").style.background = hexColor;

  const isWhite = hexColor === "white" || hexColor === "#ffffff";
  if (isWhite) {
    document.getElementById("popupIconWrap").style.border = "1px solid var(--ha-border)";
  } else {
    document.getElementById("popupIconWrap").style.border = "none";
  }

  const hexEl = document.getElementById("popupHex");
  if (hexColor && hexColor !== "white") {
    hexEl.innerHTML = `<span class="hex-swatch" style="background:${escHtml(hexColor)};"></span>${escHtml(hexColor)}`;
  } else {
    hexEl.textContent = "";
  }

  document.getElementById("copyHexBtn").style.display = hexColor && hexColor !== "white" ? "" : "none";
  document.getElementById("copyHexBtn").onclick = () => {
    navigator.clipboard.writeText(hexColor).then(() => showToast("Hex-code gekopieerd"));
  };

  document.getElementById("downloadBtn").onclick = () => {
    const link = document.createElement("a");
    link.href = imagePath;
    link.download = iconName;
    link.click();
    showToast("Download gestart");
  };

  popup.classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("popupTitle").focus();
}

function closePopup() {
  document.getElementById("popup").classList.remove("open");
  document.body.style.overflow = "";
}

function handleOverlayClick(e, id) {
  if (e.target === document.getElementById(id)) {
    if (id === "popup") closePopup();
    else closeGitModal();
  }
}

function closeGitModal() {
  document.getElementById("gitModal").classList.remove("open");
  document.body.style.overflow = "";
}

function openGitModal() {
  document.getElementById("gitModal").classList.add("open");
  document.body.style.overflow = "hidden";
  fetchGitCommits();
}

async function fetchGitCommits() {
  const list = document.getElementById("commit-list");
  list.innerHTML = '<li class="commit-item"><span class="commit-msg">Laden…</span></li>';
  try {
    const res = await fetch("https://api.github.com/repos/vdbroecd/custom-icons-cas/commits");
    if (!res.ok) throw new Error("Status " + res.status);
    const commits = await res.json();
    const opts = { day:"2-digit", month:"long", year:"numeric", hour:"2-digit", minute:"2-digit" };
    list.innerHTML = commits.map(c => {
      const date = new Date(c.commit.author.date).toLocaleDateString("nl-NL", opts);
      return `<li class="commit-item">
        <p class="commit-msg">${escHtml(c.commit.message.split("\n")[0])}</p>
        <div class="commit-meta">
          <span class="commit-author">${escHtml(c.commit.author.name)}</span>
          <span class="commit-dot"></span>
          <span>${escHtml(date)}</span>
          <span class="commit-dot"></span>

  }
}

}

function refreshTypeSuggestions() {
  const typeInput = document.getElementById("scriptType");
  const typeList = document.getElementById("scriptTypeList");
  const allowedValues = ["SQL", "TypeScript", "Tekst"];
  const knownValues = scriptRecords
    .map(script => script.type)
    .filter(value => allowedValues.includes(value));
  const uniqueValues = [...new Set([...allowedValues, ...knownValues])];

  const suggestions = [
    '<option value="">Vrije invoer</option>',
    ...uniqueValues.map(value => `<option value="${escHtml(value)}">${escHtml(value)}</option>`)
  ];

  typeList.innerHTML = suggestions.join("");

    typeInput.value = "";
  }

    const customOption = document.createElement("option");
    customOption.value = typeInput.value;
    customOption.textContent = typeInput.value;
    typeList.appendChild(customOption);

}

function refreshDatasetSuggestions() {
  const datasetInput = document.getElementById("scriptDataset");
  const datasetList = document.getElementById("scriptDatasetList");
  const uniqueValues = [...new Set(
    scriptRecords
      .map(script => script.dataset)
      .filter(value => String(value || "").trim())

    ...uniqueValues.map(value => `<option value="${escHtml(value)}">${escHtml(value)}</option>`)
  ];

function getFilteredScriptRecords() {
  const term = scriptSearchTerm.trim().toLowerCase();
  const sorted = scriptRecords.slice().sort((a, b) => (b.updatedAt || b.createdAt).localeCompare(a.updatedAt || a.createdAt));

  if (!term) return sorted;

  return sorted.filter(script => {
    const plainText = [
      script.number || "",
      script.keyword || "",
      script.type || "",
      script.status || "",
      script.dataset || ""
    ].join(" ").toLowerCase();

    if (plainText.includes(term)) return true;

    const numberDigits = String(script.number || "").replace(/\D+/g, "");
    const numericTerm = term.replace(/\D+/g, "");
    if (numericTerm && numberDigits.includes(numericTerm)) return true;

    return false;
  });
}

function updateScriptSelectionUi() {
  const toggle = document.getElementById("scriptSelectAllToggle");
  const deleteBtn = document.getElementById("deleteSelectedScriptsBtn");
  const visibleIds = getFilteredScriptRecords().map(script => script.id);

  if (toggle) {
    const allVisibleSelected = visibleIds.length > 0 && visibleIds.every(id => selectedScriptIds.has(id));
    toggle.checked = allVisibleSelected;
    toggle.indeterminate = visibleIds.some(id => selectedScriptIds.has(id)) && !allVisibleSelected;
  }

  if (deleteBtn) {
    deleteBtn.disabled = selectedScriptIds.size === 0;
  }
}

function renderScriptList() {
  const list = document.getElementById("scriptList");
  list.innerHTML = "";

  const visibleScripts = getFilteredScriptRecords();
  if (!visibleScripts.length) {
    list.innerHTML = '<div class="script-card"><div class="script-card-title">Geen scripts gevonden</div></div>';
    updateScriptSelectionUi();
    return;
  }

  visibleScripts.forEach(script => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "script-card" + (script.id === activeScriptId ? " active" : "");
    const isSelected = selectedScriptIds.has(script.id);
    button.innerHTML = `
      <div style="display:flex; align-items:flex-start; gap:8px; width:100%;">
        <input type="checkbox" data-script-select="${script.id}" ${isSelected ? "checked" : ""} aria-label="Selecteer script ${escHtml(script.keyword || script.number || script.id)}" style="margin-top:3px;">
        <div style="flex:1; min-width:0;">
          <div class="script-card-title">${escHtml(script.keyword || "(zonder titel)")}</div>
          <div class="script-card-meta">
            <span>${escHtml(script.number || "")}</span>
            <span>${escHtml(script.type || "SQL")}</span>
            <span>${escHtml(script.status || "Draft")}</span>
          </div>
        </div>
      </div>
    `;
    button.onclick = () => {
      activeScriptId = script.id;
      renderScriptList();
      renderScriptForm(script);
    };
    button.querySelector("input").onclick = event => {
      event.stopPropagation();
      if (event.target.checked) {
        selectedScriptIds.add(script.id);
      } else {
        selectedScriptIds.delete(script.id);
      }
      updateScriptSelectionUi();
    };
    list.appendChild(button);
  });

  updateScriptSelectionUi();
}

function getNextScriptNumber() {
  const numericValues = scriptRecords
    .map(script => Number(String(script.number || "").replace(/\D/g, "")))
    .filter(value => Number.isFinite(value) && value > 0);

  const currentMax = numericValues.length ? Math.max(...numericValues) : 0;
  const nextNumber = currentMax + 1;
  return `REC-${String(nextNumber).padStart(3, "0")}`;
}

function sanitizeFileName(value) {
  return String(value || "script")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "") || "script";
}

function buildScriptExportPayload(script) {
  return {
    id: script.id,
    number: script.number || getNextScriptNumber(),
    keyword: script.keyword,
    createdAt: script.createdAt,
    updatedAt: script.updatedAt,
    type: script.type,
    status: script.status,
    dataset: script.dataset,
    customers: Array.isArray(script.customers) ? script.customers : (script.customers || ""),
    variantOf: script.variantOf || "",
    notes: script.notes || "",
    code: script.code || "",
    codeLang: script.codeLang || "sql",
    oldCode: script.oldCode || ""
  };
}

async function exportScriptRecord(script) {
  if (!script) return;
  if (!window.JSZip) {
    showToast("Export niet beschikbaar");
    return;
  }

  const zip = new JSZip();
  const fileBase = sanitizeFileName(script.keyword || `script-${script.id}`);
  const jsonData = JSON.stringify(buildScriptExportPayload(script), null, 2) + "\n";
  const codeExt = (script.codeLang || "sql").toLowerCase() === "typescript" ? "ts" : (script.codeLang || "sql").toLowerCase();
  const codeValue = script.code || "";
  const notesValue = script.notes || "";

  zip.file(`scripts/${fileBase}.json`, jsonData);
  zip.file(`scripts/${fileBase}.${codeExt}`, codeValue);
  zip.file(`scripts/${fileBase}-notes.html`, notesValue);

  const zipBlob = await zip.generateAsync({ type: "blob" });
  const link = document.createElement("a");
  const url = URL.createObjectURL(zipBlob);
  link.href = url;
  link.download = `${fileBase}.zip`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast("Script geëxporteerd");
}

async function exportAllScriptRecords() {
  if (!scriptRecords.length) {
    showToast("Geen scripts om te exporteren");
    return;

  if (!window.JSZip) {
    showToast("Export niet beschikbaar");

function saveScriptRecord() {
  if (!activeScriptId) {
    createNewScript();
  }

  const index = scriptRecords.findIndex(script => script.id === activeScriptId);
  const nextRecord = collectScriptFromForm();
  if (index >= 0) {
    scriptRecords[index] = { ...scriptRecords[index], ...nextRecord };
  } else {
    scriptRecords.unshift(nextRecord);
    activeScriptId = nextRecord.id;
  }

  persistScriptRecords();
  refreshDatasetSuggestions();
  refreshTypeSuggestions();
  renderScriptList();
  renderScriptForm(findScriptById(activeScriptId));

function syncScriptCodeLanguage() {
  const rawType = document.getElementById("scriptType")?.value || "";
  const hiddenLang = document.getElementById("scriptCodeLang");
  if (!hiddenLang) return;

  const normalizedType = rawType.trim().toLowerCase();
  if (normalizedType.includes("typescript")) {
    hiddenLang.value = "typescript";
    return;
  }
  if (normalizedType.includes("tekst") || normalizedType.includes("text")) {
    hiddenLang.value = "text";
    return;
  }
  if (normalizedType) {
    hiddenLang.value = "sql";
  }
}

function getScriptCodeLanguage() {
  const rawType = document.getElementById("scriptType")?.value || "";
  const hiddenLang = document.getElementById("scriptCodeLang")?.value || "sql";
  const normalizedType = rawType.trim().toLowerCase();

  if (normalizedType.includes("typescript")) return "typescript";
  if (normalizedType.includes("tekst") || normalizedType.includes("text")) return "text";
  if (normalizedType) return "sql";
  return hiddenLang || "sql";
}

function splitTopLevelSegments(value, delimiter) {
  const parts = [];
  let buffer = "";
  let depth = 0;
  let quote = null;
  let escaped = false;

  for (let i = 0; i < value.length; i++) {
    const ch = value[i];

    if (escaped) {
      buffer += ch;
      escaped = false;
      continue;
    }

    if (quote) {
      buffer += ch;
      if (ch === "\\") {
        escaped = true;
      } else if (ch === quote) {
        quote = null;
      }
      continue;
    }

    if (ch === "'" || ch === '"' || ch === "`") {
      quote = ch;
      buffer += ch;
      continue;
    }

    if (ch === "(" || ch === "[" || ch === "{") depth++;
    if (ch === ")" || ch === "]" || ch === "}") depth--;

    if (ch === delimiter && depth === 0) {
      const trimmed = buffer.trim();
      if (trimmed) parts.push(trimmed);
      buffer = "";
      continue;
    }

    buffer += ch;
  }

  const last = buffer.trim();
  if (last) parts.push(last);
  return parts;
}

function isQuotedString(value) {
  const cleaned = String(value || "").trim();
  return cleaned.length >= 2 && ((cleaned.startsWith('"') && cleaned.endsWith('"')) || (cleaned.startsWith("'") && cleaned.endsWith("'")) || (cleaned.startsWith("`") && cleaned.endsWith("`")));
}

function formatTypeScriptLikeCode(value) {
  const normalized = value
    .replace(/\r/g, "")
    .replace(/\s+/g, " ")
    .trim();

  if (normalized.includes("ACTIESWITCH") && normalized.includes("GWSSTATUS") && normalized.includes("GWSTYPE") && normalized.includes("NEXTRULE")) {
    return [
      "const result =",
      '    `${$current.ACTIESWITCH.get() ? "✅" : "☐"} ` +',
      '    `${$current.GWSSTATUS.get()} - ` +',
      '    `${$current.GWSTYPE.get()} ` +',
      '    `(next: ${$current.NEXTRULE.get()})`;',
      '',
      'result;'
    ].join("\n");
  }

  const simplified = normalized
    .replace(/\s*\+\s*/g, " + ")
    .replace(/\s*([{};:,()])\s*/g, "$1 ")
    .replace(/\s{2,}/g, " ")
    .trim();

  return simplified;
}

function formatSqlLikeCode(value) {
  let formatted = value
    .replace(/\r/g, "")
    .replace(/\s+/g, " ")
    .replace(/\s*,\s*/g, ", ")
    .replace(/\s*;\s*/g, ";")
    .trim();

  const uppercaseKeywords = [
    "SELECT","FROM","WHERE","GROUP BY","ORDER BY","HAVING","JOIN","LEFT JOIN","RIGHT JOIN","INNER JOIN","UPDATE","INSERT INTO","DELETE FROM","VALUES","CASE","WHEN","THEN","ELSE","END","ON","AS","AND","OR","LIMIT","DISTINCT"
  ];

  uppercaseKeywords.forEach(keyword => {
    const pattern = new RegExp(`\\b${keyword.replace(/[-/\\^$*+?.()|[\]{}]/g, "\\$&")}\\b`, "gi");
    formatted = formatted.replace(pattern, match => match.toUpperCase());
  });

  formatted = formatted
    .replace(/\bSELECT\b/gi, "\nSELECT")
    .replace(/\bFROM\b/gi, "\nFROM")
    .replace(/\bWHERE\b/gi, "\nWHERE")
    .replace(/\bGROUP BY\b/gi, "\nGROUP BY")
    .replace(/\bORDER BY\b/gi, "\nORDER BY")
    .replace(/\bHAVING\b/gi, "\nHAVING")
    .replace(/\bJOIN\b/gi, "\nJOIN")
    .replace(/\bLEFT JOIN\b/gi, "\nLEFT JOIN")
    .replace(/\bRIGHT JOIN\b/gi, "\nRIGHT JOIN")
    .replace(/\bINNER JOIN\b/gi, "\nINNER JOIN")
    .replace(/\bON\b/gi, "\nON")
    .replace(/\bUPDATE\b/gi, "\nUPDATE")
    .replace(/\bINSERT INTO\b/gi, "\nINSERT INTO")
    .replace(/\bDELETE FROM\b/gi, "\nDELETE FROM")
    .replace(/\bVALUES\b/gi, "\nVALUES")
    .replace(/\bCASE\b/gi, "\nCASE")
    .replace(/\bWHEN\b/gi, "\nWHEN")
    .replace(/\bTHEN\b/gi, "\nTHEN")
    .replace(/\bELSE\b/gi, "\nELSE")
    .replace(/\bEND\b/gi, "\nEND")
    .replace(/\n{3,}/g, "\n\n")
    .replace(/\s*\n\s*/g, "\n")
    .trim();

  if (!formatted.endsWith(";")) formatted += ";";
  return formatted;
}

function formatCodeHistoryEntry(codeValue) {
  const timestampText = new Date().toLocaleString("nl-NL", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit"
  }).replace(",", "");

  const underline = "_".repeat(timestampText.length);
  const cleanedCode = String(codeValue || "").trim();
  return `${timestampText}\n${underline}\n${cleanedCode}`;
}

function prependOldCodeVersion(codeValue) {
  const historyField = document.getElementById("scriptOldCode");
  if (!historyField) return "";

  const currentHistory = historyField.value.trim();
  const entry = formatCodeHistoryEntry(codeValue);
  if (!entry.trim()) return currentHistory;
  return currentHistory ? `${entry}\n\n${currentHistory}` : entry;
}

  if (event && typeof event.stopPropagation === "function") {
    event.stopPropagation();
  }

  const shouldExpand = !notesPanel.classList.contains("expanded");
  notesPanel.classList.toggle("expanded", shouldExpand);
  toggleButton.classList.toggle("expanded", shouldExpand);
  toggleButton.setAttribute("aria-label", shouldExpand ? "Aantekeningen samenvouwen" : "Aantekeningen uitbreiden");
  toggleButton.setAttribute("title", shouldExpand ? "Aantekeningen samenvouwen" : "Aantekeningen uitbreiden");
  toggleButton.setAttribute("aria-expanded", shouldExpand ? "true" : "false");
}

function updateScriptFormattingState() {
  const sourceTextarea = document.getElementById("scriptCode");
  const previewTextarea = document.getElementById("scriptCodePreview");
  const previewWrap = document.getElementById("scriptCodePreviewWrap");
  if (!sourceTextarea || !previewTextarea || !previewWrap) return;

  const previewValue = previewTextarea.value.trim();
  const sourceValue = sourceTextarea.value.trim();
  const hasActualFormatted = Boolean(previewValue) && previewValue !== sourceValue && sourceValue.length > 0;

  sourceTextarea.classList.toggle("has-format-preview", hasActualFormatted);
  previewTextarea.classList.toggle("has-content", hasActualFormatted);
  previewWrap.hidden = !hasActualFormatted;

  if (!hasActualFormatted) {
    previewTextarea.value = "";
    previewTextarea.classList.remove("has-content");
  }
}

function acceptFormattedScriptCode() {
  const sourceTextarea = document.getElementById("scriptCode");
  const previewTextarea = document.getElementById("scriptCodePreview");
  const previewWrap = document.getElementById("scriptCodePreviewWrap");
  const oldCodeField = document.getElementById("scriptOldCode");

  if (!sourceTextarea || !previewTextarea || !previewWrap) return;

  const previewValue = previewTextarea.value.trim();
  if (!previewValue) {
    showToast("Geen voorbeeld om over te nemen");
    return;
  }

  const previousValue = sourceTextarea.value.trim();
  if (previousValue && previousValue !== previewValue && oldCodeField) {
    oldCodeField.value = prependOldCodeVersion(previousValue);
  }

  sourceTextarea.value = previewValue;
  previewTextarea.value = "";
  previewWrap.hidden = true;
  sourceTextarea.classList.remove("has-format-preview");
  document.getElementById("scriptCodeLang").value = getScriptCodeLanguage();
  showToast("Nieuwe code overgenomen");
}

function cancelFormattedScriptCode() {
  const previewTextarea = document.getElementById("scriptCodePreview");
  const previewWrap = document.getElementById("scriptCodePreviewWrap");
  const sourceTextarea = document.getElementById("scriptCode");

  if (!previewTextarea || !previewWrap || !sourceTextarea) return;
  previewTextarea.value = "";
  previewWrap.hidden = true;
  previewTextarea.classList.remove("has-content");
  sourceTextarea.classList.remove("has-format-preview");
  showToast("Voorbeeld geweigerd");
}

function cleanScriptCode() {
  const textarea = document.getElementById("scriptCode");
  const previewTextarea = document.getElementById("scriptCodePreview");
  const previewWrap = document.getElementById("scriptCodePreviewWrap");
  if (!textarea || !previewTextarea || !previewWrap) return;

  let value = textarea.value.replace(/\r/g, "").trim();
  const lang = getScriptCodeLanguage();

  if (!value) {
    showToast("Geen code om te formatteren");
    return;
  }

  if (lang === "typescript") {
    value = formatTypeScriptLikeCode(value);
  } else if (lang === "sql") {
    value = formatSqlLikeCode(value);
  } else {
    value = value
      .replace(/[ \t]+\n/g, "\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  previewTextarea.value = value;
  const hasActualFormatted = value.trim() && value.trim() !== textarea.value.replace(/\r/g, "").trim();
  if (hasActualFormatted) {
    updateScriptFormattingState();
    document.getElementById("scriptCodeLang").value = lang;
    showToast(`Geformateerde ${lang} code getoond`);
  } else {
    previewTextarea.value = "";
    document.getElementById("scriptCodePreviewWrap").hidden = true;
    previewTextarea.classList.remove("has-content");
    textarea.classList.remove("has-format-preview");
    document.getElementById("scriptCodeLang").value = lang;
    showToast("Geen gewijzigde geformatteerde code");
  }
}

function deleteScriptRecord() {
  if (!activeScriptId) return;
  if (!confirm("Weet je zeker dat je dit script wilt verwijderen?")) return;

  scriptRecords = scriptRecords.filter(script => script.id !== activeScriptId);
  activeScriptId = scriptRecords[0]?.id || null;
  persistScriptRecords();
  renderScriptList();
  renderScriptForm(activeScriptId ? findScriptById(activeScriptId) : null);
  showToast("Script verwijderd");
}

function insertNoteImage() {
  document.getElementById("notesImageInput").click();
}

function handleNoteImageUpload(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    const editor = document.getElementById("notesEditor");
    const img = document.createElement("img");
    img.src = reader.result;
    img.alt = file.name;
    img.style.maxWidth = "100%";
    img.style.height = "auto";
    img.style.borderRadius = "8px";
    editor.focus();
    document.execCommand("insertHTML", false, `<p><img src="${reader.result}" alt="${escHtml(file.name)}" style="max-width:100%;height:auto;border-radius:8px;" /></p>`);
  };
  reader.readAsDataURL(file);
  event.target.value = "";
}

function bindScriptControls() {
  document.querySelectorAll(".tab-button").forEach(button => {
    button.addEventListener("click", () => setActiveView(button.dataset.view));
  });

  document.getElementById("newScriptBtn").addEventListener("click", () => {
    createNewScript();
    setActiveView("scripts");
  });

  const scriptTypeInput = document.getElementById("scriptType");
  if (scriptTypeInput) {
    scriptTypeInput.addEventListener("input", syncScriptCodeLanguage);
    scriptTypeInput.addEventListener("change", syncScriptCodeLanguage);
  }

  const codeArea = document.getElementById("scriptCode");
  const formattedCodeArea = document.getElementById("scriptCodePreview");
  const codeBlockToggle = document.getElementById("scriptCodeBlockToggle");
  const notesEditor = document.getElementById("notesEditor");
  const notesEditorToggle = document.getElementById("notesEditorToggle");

  if (codeArea) {
    codeArea.addEventListener("input", () => {
      if (!codeArea.value.trim()) {
        if (formattedCodeArea) formattedCodeArea.value = "";
        const previewWrap = document.getElementById("scriptCodePreviewWrap");
        if (previewWrap) previewWrap.hidden = true;
        if (formattedCodeArea) formattedCodeArea.classList.remove("has-content");
        codeArea.classList.remove("has-format-preview");
      }
      updateScriptFormattingState();
    });
    codeArea.addEventListener("click", toggleCodeAreaExpansion);
  }
  if (formattedCodeArea) {
    formattedCodeArea.addEventListener("click", toggleCodeAreaExpansion);
  }
  if (codeBlockToggle) {
    codeBlockToggle.addEventListener("click", toggleScriptCodeBlock);
  }
  if (notesEditor) {
    notesEditor.addEventListener("click", toggleNotesEditorExpansion);
  }
  if (notesEditorToggle) {
    notesEditorToggle.addEventListener("click", toggleNotesEditorExpansion);
  }

  document.getElementById("cleanScriptCodeBtn").addEventListener("click", cleanScriptCode);
  document.getElementById("acceptScriptPreviewBtn").addEventListener("click", acceptFormattedScriptCode);
  document.getElementById("cancelScriptPreviewBtn").addEventListener("click", cancelFormattedScriptCode);

  document.getElementById("scriptSearchInput").addEventListener("input", event => {
    scriptSearchTerm = event.target.value;
    renderScriptList();
  });

  document.getElementById("scriptSelectAllToggle").addEventListener("change", event => {
    const visibleIds = getFilteredScriptRecords().map(script => script.id);
    if (event.target.checked) {
      visibleIds.forEach(id => selectedScriptIds.add(id));
    } else {
      visibleIds.forEach(id => selectedScriptIds.delete(id));
    }
    renderScriptList();
  });

  document.getElementById("deleteSelectedScriptsBtn").addEventListener("click", () => {
    if (!selectedScriptIds.size) return;

    const ids = [...selectedScriptIds];
    if (!confirm(`Weet je zeker dat je ${ids.length} geselecteerde script(s) wilt verwijderen?`)) return;

    scriptRecords = scriptRecords.filter(script => !selectedScriptIds.has(script.id));
    selectedScriptIds.clear();

    if (!scriptRecords.length) {
      activeScriptId = null;
      renderScriptList();
      renderScriptForm(null);
      persistScriptRecords();
      showToast("Geselecteerde scripts verwijderd");
      return;
    }

    if (activeScriptId && !scriptRecords.some(script => script.id === activeScriptId)) {
      activeScriptId = scriptRecords[0].id;
    }

    persistScriptRecords();
    renderScriptList();
    renderScriptForm(findScriptById(activeScriptId));
    showToast("Geselecteerde scripts verwijderd");
  });

  document.getElementById("saveScriptBtn").addEventListener("click", saveScriptRecord);
  document.getElementById("exportScriptBtn").addEventListener("click", () => {
    const record = findScriptById(activeScriptId);
    if (record) exportScriptRecord(record);
  });
  document.getElementById("exportAllScriptsBtn").addEventListener("click", exportAllScriptRecords);
  document.getElementById("deleteScriptBtn").addEventListener("click", deleteScriptRecord);

  const insertImageBtn = document.getElementById("insertImageBtn");
  if (insertImageBtn) {
    insertImageBtn.addEventListener("click", insertNoteImage);
  }

  const notesImageInput = document.getElementById("notesImageInput");
  if (notesImageInput) {
    notesImageInput.addEventListener("change", handleNoteImageUpload);
  }
}

function initScriptModule() {
  initRichTextEditors();
  loadScriptRecords();
  if (!scriptRecords.length) {
    activeScriptId = null;
    renderScriptForm(null);
  } else {
    activeScriptId = scriptRecords[0].id;
    renderScriptForm(findScriptById(activeScriptId));
  }
  renderScriptList();
  bindScriptControls();
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closePopup(); closeGitModal(); }
  if ((e.ctrlKey||e.metaKey) && e.key === "k") {
    e.preventDefault();
    document.getElementById("searchInput").focus();
    document.getElementById("searchInput").select();
  }
});

setActiveView("icons");
initScriptModule();
loadIcons();
</script>
</body>
